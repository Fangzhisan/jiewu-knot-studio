name: 检查并发布网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: 读取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
          cache: npm
      - name: 安装锁定版本的依赖
        run: npm ci
      - name: 检查代码格式与几何算法
        run: |
          npm run format:check
          node --test scripts/check-knot-geometry.test.mjs scripts/bead-project-geometry.test.mjs scripts/knot-review-fingerprint.test.mjs
      - name: 检查课程目录与已复核版本
        run: |
          npm run check:knot-atlas
          npm run check:weaving-atlas
          npm run check:bead-atlas
          npm run check:courses
      - name: 检查端号和珠线端帽
        run: |
          npm run check:end-labels
          npm run check:bead-caps
      - name: 读取 Pages 发布路径
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: 构建网站
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - name: 上传静态网站
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
