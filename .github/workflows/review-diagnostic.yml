name: 比对课程跨平台数据
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: 导出失配课程的实际采样
        run: |
          node --input-type=module <<'JS'
          import {createServer} from 'vite';
          import {mkdir,writeFile} from 'node:fs/promises';
          import {gzipSync} from 'node:zlib';
          import {knotReviewFingerprint} from './scripts/knot-review-fingerprint.mjs';
          const server=await createServer({root:process.cwd(),configFile:false,appType:'custom',optimizeDeps:{noDiscovery:true,include:[]},server:{middlewareMode:true,hmr:false,ws:false,watch:null}});
          try {
            const {COURSES}=await server.ssrLoadModule('/src/lessons/catalog.ts');
            const {KNOT_ATLAS}=await server.ssrLoadModule('/src/knotAtlas/index.ts');
            const groups=[['knotAtlas','KNOT_REVIEWED_VERSIONS'],['weavingAtlas','WEAVING_REVIEWED_VERSIONS'],['beadAtlas','BEAD_REVIEWED_VERSIONS']];
            const report=[];await mkdir('review-samples',{recursive:true});
            for(const [dir,key] of groups){
              const m=await server.ssrLoadModule('/src/'+dir+'/reviewedVersions.ts');
              for(const [id,expected] of Object.entries(m[key])){
                const courseId=dir==='knotAtlas'?KNOT_ATLAS.find(n=>n.id===id).localCourse.courseId:id;
                const c=COURSES.find(c=>c.id===courseId),actual=knotReviewFingerprint(c),matches=actual===expected;
                report.push({group:dir,id,courseId,expected,actual,matches});
                if(!matches){const {getState,...metadata}=c;await writeFile('review-samples/'+courseId+'.json.gz',gzipSync(JSON.stringify({metadata,frames:Array.from({length:251},(_,i)=>getState(i/250))})));console.log('Mismatch',courseId);}
              }
            }
            await writeFile('review-samples/report.json',JSON.stringify(report,null,2));console.log('Checked',report.length,'mismatches',report.filter(r=>!r.matches).length);
          }finally{await server.close();}
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-samples
          path: review-samples
          retention-days: 3
